<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070b16">
<title>TalkNet Admin</title>
<style>
:root {
  --ink: #070b16;
  --card: rgba(14, 24, 40, 0.78);
  --line: rgba(62, 230, 208, 0.28);
  --teal: #3ee6d0;
  --mint: #9dffc4;
  --text: #e7fff8;
  --muted: #93a8b8;
  --danger: #ff6b7a;
  --warn: #ffc56b;
  --ok: #9dffc4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(900px 420px at 8% -10%, rgba(62, 230, 208, 0.18), transparent 55%),
    radial-gradient(700px 380px at 100% 0%, rgba(157, 255, 196, 0.12), transparent 50%),
    var(--ink);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--teal); }
header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 22px 28px 8px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { width: 40px; height: 40px; border-radius: 12px; }
.brand h1 { margin: 0; font-size: 22px; letter-spacing: 0.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.who { color: var(--mint); font-size: 14px; }
main { padding: 8px 28px 48px; max-width: 1100px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 18px;
  backdrop-filter: blur(16px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
}
.login {
  max-width: 420px;
  margin: 8vh auto 0;
  text-align: center;
}
.login h2 { margin: 8px 0 4px; }
.login p { color: var(--muted); margin-top: 0; }
label { display: block; text-align: left; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
input, textarea {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(0, 0, 0, 0.28);
  border-radius: 12px;
  padding: 12px 14px;
}
textarea { min-height: 72px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  background: linear-gradient(180deg, var(--mint), var(--teal));
  color: #04221c;
  font-weight: 700;
}
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.warn { background: transparent; color: var(--warn); border: 1px solid rgba(255, 197, 107, 0.45); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(255, 107, 122, 0.5); }
.btn:disabled { opacity: 0.45; cursor: default; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 12px 0; }
.stat strong { display: block; font-size: 28px; color: var(--mint); }
.stat span { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 12px; }
.section { margin-top: 12px; }
.section h2 { margin: 0 0 12px; font-size: 18px; }
.muted { color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; }
.bar {
  flex: 1;
  min-width: 0;
  background: linear-gradient(180deg, var(--mint), rgba(62, 230, 208, 0.25));
  border-radius: 6px 6px 2px 2px;
  position: relative;
}
.bar span {
  display: none;
  position: absolute;
  left: 50%;
  bottom: 100%;
  transform: translateX(-50%);
  background: #04140f;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 6px;
  white-space: nowrap;
  font-size: 11px;
  z-index: 1;
}
.bar:hover span { display: block; }
.report, .person, .group {
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  padding: 12px 0;
}
.report:first-of-type, .person:first-of-type, .group:first-of-type { border-top: 0; }
.tag {
  display: inline-block;
  border-radius: 999px;
  padding: 2px 8px;
  font-size: 12px;
  border: 1px solid var(--line);
  color: var(--teal);
}
.tag.bad { color: var(--danger); border-color: rgba(255, 107, 122, 0.45); }
.error { color: var(--danger); min-height: 1.2em; }
.detail { color: var(--muted); font-size: 14px; white-space: pre-wrap; }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 8px 6px; vertical-align: top; font-weight: 500; }
th { color: var(--muted); font-size: 12px; font-weight: 600; }
.err { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #ffd0d4; }
footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
@media (max-width: 800px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .stats, .grid { grid-template-columns: 1fr 1fr; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/icon.png" alt="">
    <div>
      <h1>TalkNet</h1>
      <p>Admin</p>
    </div>
  </div>
  <div class="spacer"></div>
  <div id="who" class="who"></div>
  <button id="logout" class="btn ghost" type="button" hidden>Logg ut</button>
</header>
<main>
  <section id="login" class="card login">
    <img src="/icon.png" alt="" width="72" height="72" style="border-radius:18px">
    <h2>TalkNet</h2>
    <p>Logg inn med en administratorkonto.</p>
    <form id="loginForm">
      <label for="username">Brukernavn</label>
      <input id="username" name="username" autocapitalize="none" autocomplete="username" required>
      <label for="password">Passord</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="loginError" class="error"></p>
      <button class="btn" type="submit">Logg inn</button>
    </form>
  </section>
  <section id="app" hidden>
    <div id="stats" class="stats"></div>
    <div class="grid">
      <section class="card section">
        <h2>Siste 30 dager</h2>
        <p id="daySummary" class="muted"></p>
        <div id="bars" class="bars"></div>
      </section>
      <section class="card section">
        <h2>Server</h2>
        <div id="status"></div>
      </section>
    </div>
    <section class="card section">
      <h2>Åpne rapporter</h2>
      <div id="reports"></div>
    </section>
    <section class="card section">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Brukere</h2>
        <input id="userQuery" placeholder="Søk" style="max-width:220px" autocapitalize="none">
      </div>
      <div id="users"></div>
    </section>
    <section class="card section">
      <h2>Grupper</h2>
      <div id="groups"></div>
    </section>
    <p id="flash" class="muted"></p>
    <footer>TalkNet · Created by ™ Skutle</footer>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value == null ? '' : value).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function showLogin() {
  $('login').hidden = false;
  $('app').hidden = true;
  $('logout').hidden = true;
  $('who').textContent = '';
}
function showApp(me) {
  $('login').hidden = true;
  $('app').hidden = false;
  $('logout').hidden = false;
  $('who').textContent = me.displayName ? (me.displayName + ' (@' + me.username + ')') : ('@' + me.username);
}
async function api(path, options) {
  const res = await fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, options || {}));
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) {
    showLogin();
    throw new Error(data.error || 'Logg inn');
  }
  if (!res.ok) throw new Error(data.error || 'Noe gikk galt');
  return data;
}
function when(ms) {
  if (!ms) return '';
  try { return new Date(ms).toLocaleString('nb-NO'); } catch (e) { return ''; }
}
function uptime(seconds) {
  const s = Math.max(0, Number(seconds) || 0);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (d) return d + 'd ' + h + 't ' + m + 'm';
  if (h) return h + 't ' + m + 'm';
  return m + 'm';
}
let busy = false;
function lock(on) { busy = on; document.querySelectorAll('#app button').forEach((button) => { button.disabled = on; }); }

async function refresh() {
  const [overview, reports, users, groups, status] = await Promise.all([
    api('/admin/api/overview'),
    api('/admin/api/reports'),
    api('/admin/api/users?q=' + encodeURIComponent($('userQuery').value || '')),
    api('/admin/api/groups'),
    api('/admin/api/status')
  ]);
  const today = overview.today || {};
  $('stats').innerHTML = [
    ['Brukere', overview.users],
    ['Grupper', overview.groups],
    ['Pålogget nå', overview.online],
    ['I dag', (today.transmissions || 0) + ' · ' + (today.talkMinutes || 0) + ' min']
  ].map((item) => '<div class="card stat"><strong>' + esc(item[1]) + '</strong><span>' + esc(item[0]) + '</span></div>').join('');
  const days = overview.days || [];
  const max = Math.max(1, ...days.map((day) => day.transmissions || 0));
  const totalTx = days.reduce((sum, day) => sum + (day.transmissions || 0), 0);
  const totalMin = days.reduce((sum, day) => sum + (day.talkMinutes || 0), 0);
  $('daySummary').textContent = totalTx + ' sendinger · ' + (Math.round(totalMin * 10) / 10) + ' taleminutter (UTC)';
  $('bars').innerHTML = days.map((day) => {
    const height = Math.max(4, Math.round(((day.transmissions || 0) / max) * 112));
    const title = day.day + ': ' + day.transmissions + ' sendinger, ' + day.talkMinutes + ' min';
    return '<div class="bar" style="height:' + height + 'px"><span>' + esc(title) + '</span></div>';
  }).join('');
  const list = reports.reports || [];
  $('reports').innerHTML = list.length ? list.map((report) => (
    '<article class="report" data-id="' + esc(report.id) + '">' +
    '<div class="row"><strong>@' + esc(report.targetUsername) + '</strong>' +
    (report.targetName ? '<span class="muted">' + esc(report.targetName) + '</span>' : '') +
    (report.targetBanned ? '<span class="tag bad">Stengt</span>' : '') +
    '<span class="muted">' + esc(report.room || 'uten gruppe') + '</span></div>' +
    '<p>' + esc(report.reason) + '</p>' +
    '<p class="detail">Fra @' + esc(report.reporter) + ' · ' + esc(when(report.createdAt)) + '</p>' +
    '<div class="detail" data-detail hidden></div>' +
    '<label>Notat</label><textarea data-note placeholder="Valgfritt. Advarsel bruker rapportens begrunnelse hvis feltet er tomt."></textarea>' +
    '<div class="row"><button class="btn ghost" type="button" data-act="view">Se</button>' +
    '<button class="btn ghost" type="button" data-act="resolve">Løst</button>' +
    '<button class="btn warn" type="button" data-act="warn">Advar</button>' +
    '<button class="btn danger" type="button" data-act="ban">Steng ute</button></div></article>'
  )).join('') : '<p class="muted">Ingen åpne rapporter.</p>';
  const people = users.users || [];
  $('users').innerHTML = people.length ? '<table><thead><tr><th>Bruker</th><th>Status</th><th></th></tr></thead><tbody>' + people.map((user) => (
    '<tr class="person"><td><strong>@' + esc(user.username) + '</strong><div class="muted">' + esc(user.displayName || '') + '</div>' +
    (user.banReason ? '<div class="detail">' + esc(user.banReason) + '</div>' : '') + '</td><td>' +
    (user.banned ? '<span class="tag bad">Stengt</span>' : '<span class="tag">Aktiv</span>') + '</td><td><div class="row">' +
    (user.banned
      ? '<button class="btn ghost" type="button" data-user="' + esc(user.username) + '" data-act="unban">Opphev</button>'
      : '<button class="btn danger" type="button" data-user="' + esc(user.username) + '" data-act="ban-user">Steng ute</button>') +
    '<button class="btn danger" type="button" data-user="' + esc(user.username) + '" data-act="delete-user">Slett</button></div></td></tr>'
  )).join('') + '</tbody></table>' : '<p class="muted">Ingen brukere.</p>';
  const rooms = groups.groups || [];
  $('groups').innerHTML = rooms.length ? rooms.map((group) => (
    '<div class="group row" style="justify-content:space-between"><div><strong>' + esc(group.name || group.id) + '</strong>' +
    '<div class="detail">' + esc(group.id) + (group.direct ? ' · direkte' : '') + ' · ' + esc(group.members) + ' medlemmer</div></div>' +
    '<button class="btn danger" type="button" data-group="' + esc(group.id) + '" data-act="delete-group">Slett</button></div>'
  )).join('') : '<p class="muted">Ingen grupper.</p>';
  const errors = (status.errors || []).slice(0, 8);
  $('status').innerHTML =
    '<p>Oppetid <strong>' + esc(uptime(status.uptime)) + '</strong></p>' +
    '<p>Versjon <strong>' + esc(status.version || '') + '</strong>' + (status.sha ? ' <span class="detail">' + esc(String(status.sha).slice(0, 12)) + '</span>' : '') + '</p>' +
    '<p>Lager <strong>' + esc(status.store || '') + '</strong></p>' +
    (errors.length ? errors.map((item) => '<p class="err">' + esc(when(item.at)) + ' ' + esc(item.message) + '</p>').join('') : '<p class="muted">Ingen feil i denne økten.</p>');
}

$('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  $('loginError').textContent = '';
  try {
    const res = await fetch('/admin/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('username').value, password: $('password').value })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Feil brukernavn eller passord');
    $('password').value = '';
    showApp(data);
    await refresh();
  } catch (error) {
    $('loginError').textContent = error.message;
  }
});

$('logout').addEventListener('click', async () => {
  try { await api('/admin/api/logout', { method: 'POST', body: '{}' }); } catch (e) {}
  showLogin();
});

let queryTimer = 0;
$('userQuery').addEventListener('input', () => {
  clearTimeout(queryTimer);
  queryTimer = setTimeout(() => { refresh().catch((error) => { $('flash').textContent = error.message; }); }, 200);
});

document.body.addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-act]');
  if (!button || busy) return;
  const act = button.getAttribute('data-act');
  const card = button.closest('.report');
  try {
    lock(true);
    $('flash').textContent = '';
    if (act === 'view' && card) {
      const report = await api('/admin/api/reports/' + card.getAttribute('data-id'));
      const box = card.querySelector('[data-detail]');
      box.hidden = false;
      box.textContent = '@' + report.targetUsername + (report.targetName ? ' (' + report.targetName + ')' : '') +
        '\nGruppe: ' + (report.room || '—') +
        '\nFra: @' + (report.reporter || '—') +
        '\n' + when(report.createdAt) +
        '\n\n' + (report.reason || '');
      return;
    }
    if (card && (act === 'resolve' || act === 'warn' || act === 'ban')) {
      const id = card.getAttribute('data-id');
      const note = (card.querySelector('[data-note]').value || '').trim();
      if (act === 'ban' && !confirm('Stenge ute brukeren i denne rapporten?')) return;
      if (act === 'warn' && !confirm('Sende en advarsel?')) return;
      await api('/admin/api/reports/' + id + '/' + act, { method: 'POST', body: JSON.stringify({ note }) });
      $('flash').textContent = act === 'resolve' ? 'Rapporten er merket løst.' : (act === 'warn' ? 'Advarselen er lagret.' : 'Brukeren er stengt ute.');
      await refresh();
      return;
    }
    if (act === 'ban-user' || act === 'unban' || act === 'delete-user') {
      const username = button.getAttribute('data-user');
      if (act === 'ban-user') {
        const reason = prompt('Begrunnelse for å stenge ute @' + username, '') || '';
        if (!confirm('Stenge ute @' + username + '?')) return;
        await api('/admin/api/users/' + encodeURIComponent(username) + '/ban', { method: 'POST', body: JSON.stringify({ reason }) });
      } else if (act === 'unban') {
        await api('/admin/api/users/' + encodeURIComponent(username) + '/unban', { method: 'POST', body: '{}' });
      } else {
        if (!confirm('Slette @' + username + '? Dette kan ikke angres.')) return;
        await api('/admin/api/users/' + encodeURIComponent(username), { method: 'DELETE' });
      }
      await refresh();
      return;
    }
    if (act === 'delete-group') {
      const id = button.getAttribute('data-group');
      if (!confirm('Slette gruppen ' + id + '?')) return;
      await api('/admin/api/groups/' + encodeURIComponent(id), { method: 'DELETE' });
      await refresh();
    }
  } catch (error) {
    $('flash').textContent = error.message;
  } finally {
    lock(false);
  }
});

api('/admin/api/me').then((me) => { showApp(me); return refresh(); }).catch(() => showLogin());
setInterval(() => {
  if ($('app').hidden) return;
  const active = document.activeElement;
  if (active && (active.tagName === 'TEXTAREA' || active.id === 'userQuery')) return;
  refresh().catch(() => {});
}, 15000);
</script>
</body>
</html>
